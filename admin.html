<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
XX8.COM IP SECURITY ADMIN
</title>


<style>


*{

margin:0;
padding:0;
box-sizing:border-box;

font-family:
Segoe UI,Arial;

}



body{


height:100vh;


background:

radial-gradient(
circle at center,
#52001c,
#050005 75%
);



display:flex;

align-items:center;

justify-content:center;


color:white;


overflow:hidden;



}




body:before{


content:"";


position:absolute;


width:900px;

height:900px;



background:

radial-gradient(
circle,
rgba(255,0,85,.35),
transparent 65%
);




filter:blur(80px);


animation:

pulse 4s infinite;




}




@keyframes pulse{


50%{


scale:1.3;

opacity:.7;


}



}





.admin{


position:relative;

z-index:2;



width:650px;



padding:45px;




background:


rgba(15,0,10,.75);



border:

1px solid #ff0055;



border-radius:30px;




box-shadow:



0 0 80px rgba(255,0,85,.7);



backdrop-filter:

blur(25px);



}





.logo{


text-align:center;


font-size:55px;


font-weight:900;


letter-spacing:5px;



}




.logo span{


color:#ff0055;


}





.title{


text-align:center;


margin-top:10px;


letter-spacing:5px;


font-size:14px;


color:#ff99bb;



}




.line{


height:2px;


margin:30px 0;


background:


linear-gradient(

90deg,

transparent,

#ff0055,

transparent

);



}




.add-box{


display:flex;


gap:15px;



}





input{


flex:1;


padding:16px;


background:#050505;


border:

1px solid #ff0055;




border-radius:12px;


color:white;


font-size:16px;



}




button{


padding:16px 25px;


border:none;


border-radius:12px;



background:


linear-gradient(

90deg,

#ff0055,

#ff5580

);




color:white;


font-weight:bold;


cursor:pointer;




box-shadow:


0 0 25px #ff0055;




}



button:hover{


transform:

translateY(-3px);


}





.list-title{


margin-top:35px;


margin-bottom:15px;


letter-spacing:3px;


color:#ff99bb;



}





.ip-card{


display:flex;


justify-content:space-between;


align-items:center;




padding:15px;




margin-bottom:12px;




background:


rgba(255,0,85,.1);




border:


1px solid rgba(255,0,85,.4);




border-radius:15px;



}



.ip{


font-family:monospace;


color:#00ff88;



}





.delete{


background:


#700020;


box-shadow:none;


padding:


10px 18px;



}



.delete:hover{


background:#ff0055;


}





.status{


margin-top:25px;


text-align:center;


color:#00ff88;


font-size:13px;


letter-spacing:2px;



}





.scan{


position:absolute;


top:0;

left:0;



height:2px;


width:100%;



background:#ff0055;


box-shadow:


0 0 20px #ff0055;



animation:


scan 3s infinite;



}




@keyframes scan{


from{


top:0;


}



to{


top:100%;


}



}


</style>


</head>
<body>


<div class="admin">


<div class="scan"></div>



<div class="logo">

XX8<span>.COM</span>

</div>



<div class="title">

IP SECURITY MANAGEMENT

</div>



<div class="line"></div>



<div class="add-box">


<input

id="ip"

placeholder="ENTER NEW IP ADDRESS"



>


<button onclick="addIP()">

ADD IP

</button>



</div>





<div class="list-title">

AUTHORIZED IP LIST

</div>




<div id="list">

Loading...

</div>




<div class="status">

🟢 SYSTEM ONLINE

</div>



</div>







<script>


// ===============================
// RENDER SERVER
// ===============================


const API = 
"https://xx8-server.onrender.com";




// ===============================
// LOAD IP LIST
// ===============================


async function loadIP(){


try{


let res = await fetch(

API + "/api/ip-list"

);



let data = await res.json();




let html = "";




data.allowIP.forEach(ip=>{



html += `


<div class="ip-card">


<div class="ip">

🟢 ${ip}

</div>



<button

class="delete"

onclick="removeIP('${ip}')"

>

DELETE

</button>



</div>



`;



});





document.getElementById("list").innerHTML = html;



}

catch(error){



document.getElementById("list").innerHTML =


`

<div style="color:#ff5580">

⚠ SERVER NOT CONNECTED

</div>


`;



}



}





// ===============================
// ADD IP
// ===============================



async function addIP(){



let ip =

document.getElementById("ip").value.trim();




if(!ip){


alert("Vui lòng nhập IP");


return;


}





await fetch(


API + "/api/add-ip",


{


method:"POST",


headers:{


"Content-Type":

"application/json"


},


body:JSON.stringify({


ip:ip


})


}



);






document.getElementById("ip").value="";



loadIP();



}







// ===============================
// DELETE IP
// ===============================



async function removeIP(ip){



let ok = confirm(

"Xóa IP này?"

);



if(!ok)

return;







await fetch(


API + "/api/remove-ip",


{


method:"POST",


headers:{


"Content-Type":

"application/json"


},


body:JSON.stringify({


ip:ip


})


}



);





loadIP();



}






// AUTO LOAD


loadIP();



</script>




</body>


</html>
