<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>XX8 - Lưu Trình Xuất Khoản</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    height:100vh;

    font-family:"Segoe UI",Arial,sans-serif;

    background:#080609;

    color:white;

    overflow:hidden;
}

.header{
    height:72px;

    display:flex;
    align-items:center;

    padding:0 25px;

    gap:25px;

    background:
        rgba(15,10,14,.94);

    border-bottom:
        1px solid rgba(255,40,95,.35);
}

.back{
    padding:11px 22px;

    border:none;
    border-radius:14px;

    background:
        linear-gradient(
            135deg,
            #ff275e,
            #b90040
        );

    color:white;

    font-weight:800;

    cursor:pointer;
}

.title{
    font-size:18px;
    font-weight:800;
}

.title span{
    color:#ff3970;
}

.pdf-view{
    height:
        calc(100vh - 72px);

    background:white;
}

iframe{
    width:100%;
    height:100%;
    border:none;
}

</style>

</head>

<body>


<header class="header">

    <button class="back" onclick="history.back()">
        ← QUAY LẠI
    </button>

    <div class="title">
        LƯU TRÌNH
        <span>XUẤT KHOẢN XX8</span>
    </div>

</header>


<div class="pdf-view">

    <iframe src="luu_trinh_xuat_khoan(1).pdf"></iframe>

</div>


</body>

</html>
